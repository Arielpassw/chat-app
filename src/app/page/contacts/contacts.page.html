<ion-content
  [fullscreen]="true"
  class="contacts-content">

  <div class="contacts-container">

    <!-- ENCABEZADO -->
    <div class="top-section">

      <div>

        <button
          class="back-button"
          (click)="volverChats()">

          <ion-icon
            name="arrow-back-outline">
          </ion-icon>

        </button>

        <div class="title-section">

          <span>Comunidad</span>

          <h1>
            Contactos
          </h1>

        </div>

      </div>

      <button
        class="profile-button"
        (click)="irAPerfil()">

        <ion-icon
          name="person-outline">
        </ion-icon>

      </button>

    </div>


    <!-- BUSCADOR -->
    <div class="search-box">

      <ion-icon
        name="search-outline">
      </ion-icon>

      <input
        type="text"
        [(ngModel)]="busqueda"
        placeholder="Buscar contactos..."
      />

      <button
        *ngIf="busqueda"
        class="clear-button"
        (click)="busqueda = ''">

        <ion-icon
          name="close-circle-outline">
        </ion-icon>

      </button>

    </div>


    <!-- INFORMACIÓN -->
    <div class="contacts-info">

      <div class="info-icon">

        <ion-icon
          name="people-outline">
        </ion-icon>

      </div>

      <div>

        <h2>
          Mis contactos
        </h2>

        <p>
          Encuentra personas y comienza una conversación.
        </p>

      </div>

    </div>


    <!-- CONTADOR -->
    <div class="section-header">

      <h2>
        Personas
      </h2>

      <span>
        {{ contactosFiltrados.length }}
      </span>

    </div>


    <!-- LISTA -->
    <div class="contact-list">

      <div
        class="contact-item"
        *ngFor="let contacto of contactosFiltrados">

        <div class="avatar">

          {{ contacto.avatar }}

        </div>


        <div class="contact-info">

          <h3>
            {{ contacto.nombre }}
          </h3>

          <p>
            {{ contacto.usuario }}
          </p>

          <span class="status">

            <span class="status-dot"></span>

            {{ contacto.estado }}

          </span>

        </div>


        <button
          class="chat-button"
          (click)="iniciarChat(contacto)">

          <ion-icon
            name="chatbubble-outline">
          </ion-icon>

        </button>

      </div>

    </div>


    <!-- SIN RESULTADOS -->
    <div
      class="empty-state"
      *ngIf="contactosFiltrados.length === 0">

      <div class="empty-icon">

        <ion-icon
          name="person-outline">
        </ion-icon>

      </div>

      <h2>
        No encontramos contactos
      </h2>

      <p>
        Intenta buscar con otro nombre o usuario.
      </p>

    </div>

  </div>

</ion-content>
