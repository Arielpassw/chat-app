<ion-content [fullscreen]="true" class="media-content">

  <div class="media-container">

    <!-- Encabezado -->
    <div class="top-section">

      <button class="back-button" (click)="volverChat()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <div class="page-title">
        <span>ARCHIVO MULTIMEDIA</span>
        <h1>Vista previa</h1>
      </div>

      <div class="top-spacer"></div>

    </div>

    <!-- Vista previa -->
    <div class="preview-card">

      <div class="image-preview">
        <img
          [src]="archivo.url"
          [alt]="archivo.nombre"
        />
      </div>

      <!-- Información del archivo -->
      <div class="file-information">

        <div class="file-icon">
          <ion-icon name="image-outline"></ion-icon>
        </div>

        <div class="file-details">
          <h2>{{ archivo.nombre }}</h2>
          <p>{{ archivo.tipo }} · {{ archivo.tamano }}</p>
        </div>

      </div>

    </div>

    <!-- Acciones -->
    <div class="actions-section">

      <button class="cancel-button" (click)="cancelar()">
        <ion-icon name="close-outline"></ion-icon>
        Cancelar
      </button>

      <button class="send-button" (click)="enviarArchivo()">
        <ion-icon name="send-outline"></ion-icon>
        Enviar archivo
      </button>

    </div>

  </div>
