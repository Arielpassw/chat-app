<ion-content [fullscreen]="true" class="login-content">

  <div class="login-container">

    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="chatbubbles-outline"></ion-icon>
      </div>

      <h1>Chat App</h1>

      <p>
        Conecta con tus personas favoritas
      </p>
    </div>

    <div class="form-section">

      <div class="input-group">
        <ion-icon name="mail-outline"></ion-icon>

        <ion-input
          type="email"
          label="Correo electrónico"
          label-placement="floating"
          fill="outline"
          [(ngModel)]="email"
          autocomplete="email">
        </ion-input>
      </div>

      <div class="input-group">
        <ion-icon name="lock-closed-outline"></ion-icon>

        <ion-input
          [type]="mostrarPassword ? 'text' : 'password'"
          label="Contraseña"
          label-placement="floating"
          fill="outline"
          [(ngModel)]="password"
          autocomplete="current-password">
        </ion-input>

        <ion-button
          fill="clear"
          class="password-button"
          (click)="alternarPassword()"
          type="button">

          <ion-icon
            slot="icon-only"
            [name]="mostrarPassword
              ? 'eye-off-outline'
              : 'eye-outline'">
          </ion-icon>

        </ion-button>
      </div>

      <ion-text
        color="danger"
        *ngIf="errorMensaje">

        <p class="error-message">
          {{ errorMensaje }}
        </p>

      </ion-text>

      <ion-button
        expand="block"
        class="login-button"
        (click)="iniciarSesion()"
        [disabled]="cargando">

        <ion-spinner
          *ngIf="cargando"
          name="crescent">
        </ion-spinner>

        <span *ngIf="!cargando">
          Iniciar sesión
        </span>

      </ion-button>

    </div>

    <div class="register-section">

      <p>
        ¿No tienes una cuenta?
      </p>

      <ion-button
        fill="clear"
        class="register-button"
        (click)="irARegistro()">

        Crear una cuenta

      </ion-button>

    </div>

  </div>

</ion-content>
