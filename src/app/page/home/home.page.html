<ion-content [fullscreen]="true" class="home-content">

  <div class="home-container">

    <!-- Encabezado -->
    <div class="welcome-section">
      <div>
        <span class="welcome-small">Bienvenido a</span>
        <h1>Chat App</h1>
        <p>Conecta, conversa y comparte.</p>
      </div>

      <button class="profile-button" (click)="irAPerfil()">
        <ion-icon name="person-outline"></ion-icon>
      </button>
    </div>

    <!-- Acceso principal -->
    <div class="main-card" (click)="irAChats()">
      <div class="main-icon">
        <ion-icon name="chatbubbles-outline"></ion-icon>
      </div>

      <div class="main-info">
        <span>Mis conversaciones</span>
        <p>Continúa hablando con tus contactos</p>
      </div>

      <ion-icon
        name="chevron-forward-outline"
        class="arrow-icon">
      </ion-icon>
    </div>

    <!-- Acciones rápidas -->
    <h2>Accesos rápidos</h2>

    <div class="quick-actions">

      <div class="quick-card" (click)="irAChats()">
        <div class="quick-icon chats-icon">
          <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
        </div>

        <span>Chats</span>
        <small>Ver conversaciones</small>
      </div>

      <div class="quick-card" (click)="irAContactos()">
        <div class="quick-icon contacts-icon">
          <ion-icon name="people-outline"></ion-icon>
        </div>

        <span>Contactos</span>
        <small>Buscar personas</small>
      </div>

      <div class="quick-card" (click)="irAPerfil()">
        <div class="quick-icon profile-icon">
          <ion-icon name="person-outline"></ion-icon>
        </div>

        <span>Mi perfil</span>
        <small>Editar información</small>
      </div>

      <div class="quick-card" (click)="irAConfiguracion()">
        <div class="quick-icon settings-icon">
          <ion-icon name="settings-outline"></ion-icon>
        </div>

        <span>Configuración</span>
        <small>Ajustes de la aplicación</small>
      </div>

    </div>

    <!-- Cerrar sesión -->
    <button class="logout-button" (click)="cerrarSesion()">
      <ion-icon name="log-out-outline"></ion-icon>
      <span>Cerrar sesión</span>
    </button>

  </div>

</ion-content>
